# Lightweight Camunda 8 Self-Managed stack for local demos.
# Single "orchestration" service = Zeebe (gRPC :26500) + Operate + Tasklist (both under :8080).
# Uses file-based H2 storage (see configuration/application-h2.yaml) so no Elasticsearch is needed.
# Source: adapted from https://github.com/camunda/camunda-distributions/tree/main/docker-compose/versions/camunda-8.9
services:
  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration: # Consolidated Zeebe + Operate + Tasklist
    image: camunda/camunda:${CAMUNDA_VERSION}
    container_name: orchestration
    ports:
      - "26500:26500" # Zeebe gRPC API (workers/clients connect here)
      - "9600:9600"   # Actuator / health
      - "8080:8080"   # Operate (/operate), Tasklist (/tasklist), REST API (/v2)
    env_file:
      - path: .env
        required: true
    mem_limit: 1g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 1s
      retries: 30
      start_period: 30s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    networks:
      - camunda
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

volumes:
  camunda:
  camunda-data:

networks:
  camunda:
    name: camunda

configs:
  orchestration-config:
    file: ./configuration/application-h2.yaml
